name: Build Switch IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" gdown

      - name: Save Keys
        run: |
          echo "${{ secrets.PROD_KEYS }}" > ~/prod.keys

      - name: Cache Game Files
        id: cache-game-files
        uses: actions/cache@v4
        with:
          path: game_files
          key: game-files-nsp-v1

      - name: Download Files from Google Drive (If Not Cached)
        if: steps.cache-game-files.outputs.cache-hit != 'true'
        run: |
          mkdir -p game_files
          gdown "13_xQ9D2ZzDZI76BwAAPpXOEjoL23R--x" -O game_files/base.nsp
          gdown "1CDQkJS90z1uI-UOYeCjBQwN_Bt_bgSFD" -O game_files/update.nsp

      - name: Build IPA
        env:
          NO_METAL4: '1'
          EXTRA_CFLAGS: '-DNO_METAL4=1'
          CFLAGS: '-DNO_METAL4=1'
        run: |
          NO_METAL4=1 python3 scripts/build_ipa_from_nsp.py ./game_files -k ~/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ./game_files/*.ipa
