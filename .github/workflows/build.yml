name: Build Switch IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang rclone
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Save Keys and Setup Rclone
        env:
          PROD_KEYS_DATA: ${{ secrets.PROD_KEYS }}
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$PROD_KEYS_DATA" > ~/prod.keys
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Download Game Files via Rclone
        run: |
          mkdir -p game_files
          echo "Downloading Base NSP..."
          rclone copy "gdrive:GameFiles/base.nsp" game_files/ -P
          
          echo "Downloading Update NSP..."
          rclone copy "gdrive:GameFiles/update.nsp" game_files/ -P

      - name: Inject NO_METAL4 via Compiler Interceptor
        run: |
          mkdir -p $HOME/custom_bin
          
          # Intercept direct clang calls
          cat << 'EOF' > $HOME/custom_bin/clang
          #!/bin/bash
          exec /usr/bin/clang -DNO_METAL4=1 "$@"
          EOF
          
          # Intercept clang++ calls
          cat << 'EOF' > $HOME/custom_bin/clang++
          #!/bin/bash
          exec /usr/bin/clang++ -DNO_METAL4=1 "$@"
          EOF
          
          # Intercept xcrun clang calls
          cat << 'EOF' > $HOME/custom_bin/xcrun
          #!/bin/bash
          if [ "$1" = "clang" ] || [ "$1" = "clang++" ]; then
            CMD=$1
            shift
            exec /usr/bin/xcrun $CMD -DNO_METAL4=1 "$@"
          else
            exec /usr/bin/xcrun "$@"
          fi
          EOF
          
          chmod +x $HOME/custom_bin/clang $HOME/custom_bin/clang++ $HOME/custom_bin/xcrun
          echo "$HOME/custom_bin" >> $GITHUB_PATH

      - name: Build IPA
        env:
          CFLAGS: "-DNO_METAL4=1"
          OBJCFLAGS: "-DNO_METAL4=1"
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game_files -k ~/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ./game_files/*.ipa
