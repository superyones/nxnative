name: Build Switch IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang rclone
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Save Keys and Setup Rclone
        env:
          PROD_KEYS_DATA: ${{ secrets.PROD_KEYS }}
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$PROD_KEYS_DATA" > ~/prod.keys
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Download Game Files via Rclone
        run: |
          mkdir -p game_files
          echo "Downloading Base NSP..."
          rclone copy "gdrive:GameFiles/base.nsp" game_files/ -P
          
          echo "Downloading Update NSP..."
          rclone copy "gdrive:GameFiles/update.nsp" game_files/ -P

      - name: Patch Source Code to Force Disable Metal4
        run: |
          python3 -c "
          import os
          targets = ['nvn_rec.h', 'nvn_rec.cpp', 'nvn_rec.m', 'nvn_deswizzle_gpu.h', 'nvn_deswizzle_gpu.cpp', 'nvn_deswizzle_gpu.m']
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f in targets:
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as file:
                          c = file.read()
                      if '#define NO_METAL4 1' not in c:
                          with open(p, 'w', encoding='utf-8') as file:
                              file.write('#define NO_METAL4 1\n' + c)
                          print(f'Successfully patched: {p}')
          "

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game_files -k ~/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ./game_files/*.ipa
