name: Build Switch IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" requests

      - name: Save Keys
        run: |
          echo "${{ secrets.PROD_KEYS }}" > ~/prod.keys

      - name: Cache Game Files
        id: cache-game-files
        uses: actions/cache@v4
        with:
          path: game_files
          key: game-files-nsp-v5

      - name: Download Files from Google Drive (If Not Cached)
        if: steps.cache-game-files.outputs.cache-hit != 'true'
        run: |
          mkdir -p game_files
          python3 -c "
          import requests

          def download_gdrive(file_id, destination):
              URL = 'https://docs.google.com/uc?export=download'
              session = requests.Session()
              response = session.get(URL, params={'id': file_id, 'confirm': 't'}, stream=True)
              
              token = None
              for key, value in response.cookies.items():
                  if key.startswith('download_warning'):
                      token = value
                      break
                      
              if token:
                  params = {'id': file_id, 'confirm': token}
                  response = session.get(URL, params=params, stream=True)
                  
              with open(destination, 'wb') as f:
                  for chunk in response.iter_content(chunk_size=32768):
                      if chunk:
                          f.write(chunk)

          print('Downloading Base NSP...')
          download_gdrive('1H2BlOuxilX56JikLML0RJRSJ-EKgqvY2', 'game_files/base.nsp')
          print('Downloading Update NSP...')
          download_gdrive('1AcGpXZif0oEK1dsK0nwYyiHa6h3fpU3c', 'game_files/update.nsp')
          "

      - name: Patch Source Code to Force Disable Metal4
        run: |
          find . -name "nvn_rec.h" -exec sed -i '' '1s/^/#define NO_METAL4 1\n/' {} +
          find . -name "nvn_deswizzle_gpu.h" -exec sed -i '' '1s/^/#define NO_METAL4 1\n/' {} +

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game_files -k ~/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ./game_files/*.ipa
