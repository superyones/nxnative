name: Build Switch IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" gdown

      - name: Save Keys
        run: |
          echo "${{ secrets.PROD_KEYS }}" > ~/prod.keys

      - name: Download Game Files from Google Drive
        run: |
          mkdir -p game_files
          python3 -c "
          import gdown
          print('Downloading Base NSP...')
          gdown.download(id='1H2BlOuxilX56JikLML0RJRSJ-EKgqvY2', output='game_files/base.nsp', quiet=False, fuzzy=True)
          print('Downloading Update NSP...')
          gdown.download(id='1AcGpXZif0oEK1dsK0nwYyiHa6h3fpU3c', output='game_files/update.nsp', quiet=False, fuzzy=True)
          "

      - name: Patch Source Code to Force Disable Metal4
        run: |
          find . -name "nvn_rec.h" -exec sed -i '' '1s/^/#define NO_METAL4 1\n/' {} +
          find . -name "nvn_deswizzle_gpu.h" -exec sed -i '' '1s/^/#define NO_METAL4 1\n/' {} +

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game_files -k ~/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ./game_files/*.ipa
