name: Build Switch IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Save Keys
        run: |
          echo "${{ secrets.PROD_KEYS }}" > ~/prod.keys

      - name: Cache Game Files
        id: cache-game-files
        uses: actions/cache@v4
        with:
          path: game_files
          key: game-files-nsp-v4

      - name: Download Files from Google Drive (If Not Cached)
        if: steps.cache-game-files.outputs.cache-hit != 'true'
        run: |
          mkdir -p game_files
          echo "Downloading Base NSP..."
          curl -L -C - -o "game_files/base.nsp" "https://drive.usercontent.google.com/download?id=1H2BlOuxilX56JikLML0RJRSJ-EKgqvY2&export=download&confirm=t"
          
          echo "Downloading Update NSP..."
          curl -L -C - -o "game_files/update.nsp" "https://drive.usercontent.google.com/download?id=1AcGpXZif0oEK1dsK0nwYyiHa6h3fpU3c&export=download&confirm=t"

      - name: Patch Source Code to Force Disable Metal4
        run: |
          sed -i '' '1s/^/#define NO_METAL4 1\n/' gfx/nvn/nvn_rec.h
          if [ -f gfx/tex/nvn_deswizzle_gpu.h ]; then sed -i '' '1s/^/#define NO_METAL4 1\n/' gfx/tex/nvn_deswizzle_gpu.h; fi

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game_files -k ~/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: ./game_files/*.ipa
